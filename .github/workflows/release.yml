name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify tag and metadata
        shell: pwsh
        run: ./scripts/verify-release-metadata.ps1 -ExpectedTag "${{ github.ref_name }}"
      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew clean test build --no-daemon
      - name: Create checksums
        run: |
          cd build/libs
          sha256sum fishon-catch-collector-*.jar | sort > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            build/libs/fishon-catch-collector-*.jar \
            build/libs/SHA256SUMS.txt \
            --verify-tag \
            --title "FishOn Catch Collector ${{ github.ref_name }}" \
            --generate-notes
