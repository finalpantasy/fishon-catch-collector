name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify release metadata
        shell: pwsh
        run: ./scripts/verify-release-metadata.ps1
      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew clean test build --no-daemon
